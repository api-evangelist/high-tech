aid: high-tech
name: High Tech
kind: topic
description: >-
  High Tech indexes the APIs, data services, and reference
  artifacts that power the electronics, semiconductor, hardware,
  and IoT industries. The landscape covers electronic component
  data and distribution (Octopart / Nexar, Digi-Key, Mouser, Arrow
  Electronics, Avnet, Newark / element14), ECAD and PCB design
  data (SnapEDA, Ultra Librarian, Altium 365 via Nexar Design),
  hardware lifecycle and IoT device management (AWS IoT, Azure IoT
  Hub, Particle, Golioth), bill-of-materials and component-search
  workflows used across hardware product engineering, and the
  authoritative manufacturer data that anchors a component record
  (manufacturer part number, manufacturer, datasheet, lifecycle
  status, RoHS / REACH compliance, real-time inventory and pricing
  across distributors). This index captures the canonical providers,
  the shape of a component record as JSON Schema, a JSON-LD
  context aligning with schema.org Product / Offer / Organization,
  and the domain vocabulary used across the high-tech component
  supply chain.
