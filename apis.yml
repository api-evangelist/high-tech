  - Distributors
  - OAuth
  - Ordering
  - Product Information
  properties:
  - type: Documentation
    url: https://developer.digikey.com/products
  - type: Portal
    url: https://developer.digikey.com/
  - type: OAuthAuthorization
    url: https://api.digikey.com/v1/oauth2/authorize
  - type: OAuthToken
    url: https://api.digikey.com/v1/oauth2/token
- aid: high-tech:mouser
  name: Mouser Electronics Search API
  description: >-
    Mouser Electronics exposes a REST Search API (SearchByPartNumber,
    SearchByKeyword, SearchByManufacturer), a Cart API, and an
    Order API. Authentication uses a per-application API key
    issued through Mouser's developer portal. Responses include
    MouserPartNumber, ManufacturerPartNumber, Manufacturer,
    Description, DataSheetUrl, ProductDetailUrl, Category,
    Availability, LeadTime, and PriceBreaks.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.mouser.com/api-search/
  baseURL: https://api.mouser.com
