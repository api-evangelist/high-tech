apis:
- aid: high-tech:octopart-nexar
  name: Octopart / Nexar Supply API
  description: >-
    Nexar Supply (formerly Octopart API v4) is a GraphQL API that
    aggregates electronic component data from manufacturers and
    distributors worldwide. Returns parts, manufacturers, sellers,
    offers, datasheets, lifecycle status, compliance, and CAD
    models for tens of millions of MPNs. Free Evaluation plan up
    to 100 matched parts; Enterprise plans for production use.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://nexar.com/api
  baseURL: https://api.nexar.com/graphql
  tags:
  - Component Data
  - Distributors
  - GraphQL
  - Nexar
  - Octopart
  - Supply Chain
  properties:
  - type: Documentation
    url: https://nexar.com/api
  - type: Portal
    url: https://portal.nexar.com/
  - type: Pricing
    url: https://nexar.com/api/compare-plans
  - type: GraphQLEndpoint
    url: https://api.nexar.com/graphql
  - url: graphql/high-tech-graphql.md
    type: GraphQL
- aid: high-tech:digi-key
  name: Digi-Key Product Information API
  description: >-
    Digi-Key's developer portal exposes a suite of OAuth 2.0 APIs
    including Product Information V4 (search by MPN, description,
    manufacturer, category), Quote, Ordering, Order Status, Order
    Management, MyLists, Supply Chain, Product Change
    Notifications, and Barcode. Sandbox and production
    environments separated; supports two-legged and three-legged
    OAuth flows.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.digikey.com/products
  baseURL: https://api.digikey.com
  tags:
